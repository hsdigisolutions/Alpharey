name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Style, static analysis, tests, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3 (production target)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, gd, zip, pdo_mysql, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Dependency vulnerability audit
        run: composer audit

      - name: Tests (Pest)
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build assets (Vite)
        run: |
          npm ci
          npm run build

      - name: Audit npm dependencies (production)
        run: npm audit --omit=dev --audit-level=high
